services:
  miniuptime:
    build: .
    container_name: miniuptime
    restart: unless-stopped
    stop_grace_period: 15s
    cap_add:
      - NET_RAW
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data:Z
    environment:
      TZ: Asia/Jakarta
      # Optional Telegram alerts:
      # TELEGRAM_BOT_TOKEN: ""
      # TELEGRAM_CHAT_ID: ""

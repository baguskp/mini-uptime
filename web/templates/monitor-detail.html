<!doctype html><html><body><h1>{{.Monitor.Name}}</h1><p>{{.Monitor.Type}} — {{.Monitor.Target}}</p><h2>Recent checks</h2><table><tr><th>Status</th><th>Latency</th><th>Error</th><th>Time</th></tr>{{range .Checks}}<tr><td>{{.Status}}</td><td>{{.Latency}} ms</td><td>{{.Error}}</td><td>{{.At}}</td></tr>{{else}}<tr><td colspan="4">No checks</td></tr>{{end}}</table><a href="/monitors">Back</a></body></html>

<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>New monitor — MiniUptime</title></head><body><main><nav><strong>MiniUptime</strong><a href="/dashboard"{{if eq .Active "/dashboard"}} aria-current="page"{{end}}>Dashboard</a><a href="/monitors"{{if eq .Active "/monitors"}} aria-current="page"{{end}}>Monitors</a><a href="/agents"{{if eq .Active "/monitors"}} aria-current="page"{{end}}>Agents</a><a href="/groups"{{if eq .Active "/groups"}} aria-current="page"{{end}}>Groups</a><a href="/incidents"{{if eq .Active "/incidents"}} aria-current="page"{{end}}>Incidents</a><a href="/settings"{{if eq .Active "/settings"}} aria-current="page"{{end}}>Settings</a><a href="/display"{{if eq .Active "/display"}} aria-current="page"{{end}}>Display</a></nav><section class="panel auth"><h1>New monitor</h1><p class="muted">Add endpoint to health checks.</p><form method="post" action="/monitors"><input type="hidden" name="csrf" value="{{.CSRF}}"><label for="monitor-name">Name<input id="monitor-name" aria-label="Name" name="name" required placeholder="Public website"></label><label for="monitor-type">Type<select id="monitor-type" aria-label="Type" name="type"><option value="http">HTTP</option><option value="tcp">TCP</option><option value="ping">Ping</option></select></label><label for="target">Target<input id="target" aria-label="Target" name="target" required placeholder="https://example.com"><span class="field-hint">HTTP URL, TCP host:port, or Ping hostname/IP.</span></label><label for="monitor-group">Group<select id="monitor-group" aria-label="Group" name="group_id"><option value="">None</option>{{range .Groups}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></label><label for="monitor-interval">Interval seconds<input id="monitor-interval" aria-label="Interval seconds" name="interval" type="number" min="10" value="60"></label><button>Create monitor</button><a class="form-back" href="/monitors">Cancel</a></form><script>const type=document.querySelector('[name=type]'),target=document.querySelector('#target');type.onchange=()=>target.placeholder={http:'https://example.com',tcp:'example.com:443',ping:'8.8.8.8'}[type.value]</script></section></main></body></html>

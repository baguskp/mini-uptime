<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>New monitor — MiniUptime</title></head><body><main><nav><strong>MiniUptime</strong><a href="/dashboard">Dashboard</a><a href="/monitors">Monitors</a><a href="/groups">Groups</a><a href="/incidents">Incidents</a><a href="/settings">Settings</a><a href="/display">Display</a></nav><section class="panel auth"><h1>New monitor</h1><p class="muted">Add endpoint to health checks.</p><form method="post" action="/monitors"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Name<input name="name" required placeholder="Public website"></label><label>Type<select name="type"><option value="http">HTTP</option><option value="tcp">TCP</option><option value="ping">Ping</option></select></label><label>Target<input id="target" name="target" required placeholder="https://example.com"><span class="field-hint">HTTP URL, TCP host:port, or Ping hostname/IP.</span></label><label>Group<select name="group_id"><option value="">None</option>{{range .Groups}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></label><label>Interval seconds<input name="interval" type="number" min="10" value="60"></label><button>Create monitor</button><a class="form-back" href="/monitors">Cancel</a></form><script>const type=document.querySelector('[name=type]'),target=document.querySelector('#target');type.onchange=()=>target.placeholder={http:'https://example.com',tcp:'example.com:443',ping:'8.8.8.8'}[type.value]</script></section></main></body></html>

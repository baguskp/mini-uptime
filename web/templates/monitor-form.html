<!doctype html><html><body><h1>New Monitor</h1><form method="post" action="/monitors"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Name <input name="name" required></label><label>Type <select name="type"><option value="http">HTTP</option><option value="tcp">TCP</option><option value="ping">Ping</option></select></label><label>Target <input id="target" name="target" required placeholder="https://example.com"></label><script>document.querySelector('[name=type]').onchange=e=>document.querySelector('#target').placeholder={http:'https://example.com',tcp:'example.com:443',ping:'8.8.8.8'}[e.target.value]</script><label>Interval <input name="interval" type="number" min="10" value="60"></label><button>Create</button></form></body></html>

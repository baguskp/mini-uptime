<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>Incidents — MiniUptime</title></head><body><main><nav><strong>MiniUptime</strong><a href="/dashboard"{{if eq .Active "/dashboard"}} aria-current="page"{{end}}>Dashboard</a><a href="/monitors"{{if eq .Active "/monitors"}} aria-current="page"{{end}}>Monitors</a><a href="/agents"{{if eq .Active "/monitors"}} aria-current="page"{{end}}>Agents</a><a href="/groups"{{if eq .Active "/groups"}} aria-current="page"{{end}}>Groups</a><a href="/incidents"{{if eq .Active "/incidents"}} aria-current="page"{{end}}>Incidents</a><a href="/settings"{{if eq .Active "/settings"}} aria-current="page"{{end}}>Settings</a><a href="/display"{{if eq .Active "/display"}} aria-current="page"{{end}}>Display</a></nav><div class="toolbar"><div><h1>Incidents</h1><span class="muted">Recent monitor failures and recoveries</span></div></div><section class="panel"><div class="table-wrap"><table><tr><th>Monitor</th><th>Started</th><th>Ended</th><th>Error</th></tr>{{range .Incidents}}<tr><td>{{.Monitor}}</td><td class="table-time">{{.Started}}</td><td class="table-time">{{.Ended}}</td><td>{{.Error}}</td></tr>{{else}}<tr><td colspan="4"><div class="empty-state"><h3>No incidents</h3><p class="muted">Incidents appear when a monitor goes down.</p></div></td></tr>{{end}}</table></div></section></main></body></html>

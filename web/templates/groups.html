<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>Groups — MiniUptime</title></head><body><main><nav><strong>MiniUptime</strong><a href="/dashboard">Dashboard</a><a href="/monitors">Monitors</a><a href="/groups">Groups</a><a href="/incidents">Incidents</a><a href="/settings">Settings</a><a href="/display">Display</a></nav><div class="toolbar"><div><h1>Groups</h1><span class="muted">Organize service checks</span></div></div><section class="panel inline-form"><form method="post" action="/groups"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>New group<input name="name" required placeholder="Production"></label><button>Create group</button></form></section><section class="panel"><table><tr><th>Group</th><th>Actions</th></tr>{{range .Groups}}<tr><td><strong>{{.Name}}</strong></td><td class="actions"><a href="/monitors?q={{.Name}}">View monitors</a><form method="post" action="/groups/{{.ID}}/delete" onsubmit="return confirm('Delete group?')"><input type="hidden" name="csrf" value="{{$.CSRF}}"><button class="danger">Delete</button></form></td></tr>{{else}}<tr><td colspan="2" class="muted">No groups yet.</td></tr>{{end}}</table></section></main></body></html>

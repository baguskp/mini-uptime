<!doctype html><html><body><h1>Edit Monitor</h1><form method="post" action="/monitors/{{.Monitor.ID}}"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Name <input name="name" value="{{.Monitor.Name}}" required></label><label>Type <select name="type"><option value="http" {{if eq .Monitor.Type "http"}}selected{{end}}>HTTP</option><option value="tcp" {{if eq .Monitor.Type "tcp"}}selected{{end}}>TCP</option><option value="ping" {{if eq .Monitor.Type "ping"}}selected{{end}}>Ping</option></select></label><label>Target <input id="target" name="target" value="{{.Monitor.Target}}" required></label><script>document.querySelector('[name=type]').onchange=e=>document.querySelector('#target').placeholder={http:'https://example.com',tcp:'example.com:443',ping:'8.8.8.8'}[e.target.value]</script><label>Group <select name="group_id"><option value="">None</option>{{range .Groups}}<option value="{{.ID}}" {{if eq .ID $.Monitor.GroupID}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><label>Interval <input name="interval" type="number" min="10" value="{{.Monitor.Interval}}"></label><button>Save</button></form></body></html>

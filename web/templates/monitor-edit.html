<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>Edit monitor — MiniUptime</title></head><body><main><nav><strong>MiniUptime</strong><a href="/dashboard">Dashboard</a><a href="/monitors">Monitors</a><a href="/groups">Groups</a><a href="/incidents">Incidents</a><a href="/settings">Settings</a><a href="/display">Display</a></nav><section class="panel auth"><h1>Edit monitor</h1><p class="muted">Change check target and cadence.</p><form method="post" action="/monitors/{{.Monitor.ID}}"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Name<input name="name" value="{{.Monitor.Name}}" required></label><label>Type<select name="type"><option value="http" {{if eq .Monitor.Type "http"}}selected{{end}}>HTTP</option><option value="tcp" {{if eq .Monitor.Type "tcp"}}selected{{end}}>TCP</option><option value="ping" {{if eq .Monitor.Type "ping"}}selected{{end}}>Ping</option></select></label><label>Target<input id="target" name="target" value="{{.Monitor.Target}}" required></label><label>Group<select name="group_id"><option value="">None</option>{{range .Groups}}<option value="{{.ID}}" {{if eq .ID $.Monitor.GroupID}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><label>Interval seconds<input name="interval" type="number" min="10" value="{{.Monitor.Interval}}"></label><button>Save changes</button></form></section></main></body></html>

<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>Settings — MiniUptime</title></head><body><main><nav><strong>MiniUptime</strong><a href="/dashboard">Dashboard</a><a href="/monitors">Monitors</a><a href="/groups">Groups</a><a href="/incidents">Incidents</a><a href="/settings">Settings</a><a href="/display">Display</a></nav><h1>Settings</h1><section class="panel"><h2>Display access</h2><form method="post" action="/settings"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Access mode<select name="display_mode"><option value="disabled" {{if eq .DisplayMode "disabled"}}selected{{end}}>Disabled</option><option value="public" {{if eq .DisplayMode "public"}}selected{{end}}>Public read-only</option><option value="pin" {{if eq .DisplayMode "pin"}}selected{{end}}>PIN protected</option></select></label><label>Display PIN<input name="display_pin" type="password" minlength="4" inputmode="numeric" placeholder="Leave blank to keep current"></label><button>Save display mode</button></form><h2>Telegram</h2><p class="muted">{{if .TokenSet}}Bot token saved{{else}}Bot token not set{{end}}</p><form method="post" action="/settings"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Bot token<input type="password" name="token" placeholder="123456:ABC..."></label><label>Chat ID<input name="chat_id" value="{{.ChatID}}" required></label><button>Save</button></form><form method="post" action="/settings/test"><input type="hidden" name="csrf" value="{{.CSRF}}"><button>Send test message</button></form></section></main></body></html>

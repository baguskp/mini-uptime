<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/app.css"><title>Settings — MiniUptime</title></head><body><main><nav><strong>MiniUptime</strong><a href="/dashboard">Dashboard</a><a href="/monitors">Monitors</a><a href="/groups">Groups</a><a href="/incidents">Incidents</a><a href="/settings">Settings</a><a href="/display">Display</a></nav><h1>Settings</h1>{{if .TelegramSent}}<p class="notice success">Test message sent.</p>{{end}}{{if .TelegramError}}<p class="notice error">{{.TelegramError}}</p>{{end}}<section class="panel"><h2>Display access</h2><form class="settings-form" method="post" action="/settings"><input type="hidden" name="csrf" value="{{.CSRF}}"><label for="settings-timezone">Timezone<select id="settings-timezone" aria-label="Timezone" name="timezone">{{range .Timezones}}<option value="{{.}}" {{if eq . $.Timezone}}selected{{end}}>{{.}}</option>{{end}}</select></label><label for="settings-display-mode">Access mode<select id="settings-display-mode" aria-label="Access mode" name="display_mode"><option value="disabled" {{if eq .DisplayMode "disabled"}}selected{{end}}>Disabled</option><option value="public" {{if eq .DisplayMode "public"}}selected{{end}}>Public read-only</option><option value="pin" {{if eq .DisplayMode "pin"}}selected{{end}}>PIN protected</option></select></label><label for="settings-display-pin">Display PIN<input id="settings-display-pin" aria-label="Display PIN" name="display_pin" type="password" minlength="4" inputmode="numeric" placeholder="Leave blank to keep current"></label><button>Save display settings</button></form><h2>Telegram</h2><p class="muted">{{if .TokenSet}}Bot token saved{{else}}Bot token not set{{end}}</p><form class="settings-form" method="post" action="/settings"><input type="hidden" name="csrf" value="{{.CSRF}}"><label for="settings-token">Bot token<input id="settings-token" aria-label="Bot token" type="password" name="token" placeholder="123456:ABC..."></label><label for="settings-chat">Chat ID<input id="settings-chat" aria-label="Chat ID" name="chat_id" value="{{.ChatID}}" required autocomplete="off"></label><button>Save Telegram settings</button></form><form method="post" action="/settings/test"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="button button-ghost">Send test message</button></form></section></main></body></html>
